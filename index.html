}
function render(){
  if (!view) return;
  var p = me(), o = opp();
  // status + banner
  var st = $('status'); st.innerHTML = '';
  if (mode === 'online') { st.appendChild(el('span', null, meta.code || '')); }
  if (mode === 'p2p') { st.appendChild(el('span', null, p2p.connected ? '⇄' : '⇄ ✕')); }
  var turnLabel = mode === 'local' ? t('turnLocal', { name: view.players[view.current].name }) : (myTurn() ? t('turnYou') : t('turnOpp', { name: o.name }));
  var banner = $('banner'); banner.innerHTML = '';
  banner.className = 'banner' + ((mode === 'local' || myTurn()) ? ' mine' : '') + (view.endTriggered ? ' last' : '');
  banner.appendChild(document.createTextNode(view.phase === 'over' ? t('over') : turnLabel));
  var waiting = view.phase !== 'over' && !myTurn() &&
                (bot ? true : mode === 'local' ? false :
                 mode === 'p2p' ? p2p.connected : !!(meta.players[1 - seat] && meta.players[1 - seat].connected));
  if (waiting) banner.appendChild(el('span', 'thinking'));
  if (view.endTriggered && view.phase !== 'over') banner.appendChild(el('small', null, t('lastRound')));
  if (mode === 'online' && meta.players[1 - seat] && !meta.players[1 - seat].connected && view.phase !== 'over') {
    banner.appendChild(el('small', null, t('oppGone', { name: o.name })));
    if (meta.canClaim) {
      var cb = el('button', 'btn reconnect', t('claimWin'));
      cb.onclick = function(){ send({ t: 'claimWin' }); };
      banner.appendChild(cb);
    }
  }
  if (mode === 'p2p' && !p2p.connected && view.phase !== 'over') {
    banner.appendChild(el('small', null, t('peerLost')));
    var rb = el('button', 'btn reconnect', t('reconnectBtn')); rb.onclick = function(){ p2pReconnect(); }; banner.appendChild(rb);
  }
  playerEl(o, 1 - seat, false);
  playerEl(p, seat, true);
  // nobles
  var nb = $('nobles'); nb.innerHTML = '';
  view.nobles.forEach(function(id){ nb.appendChild(nobleEl(S.NOBLE_BY_ID[id], S.nobleEligible(p, id))); });
  // tiers
  var active = (mode === 'local' || myTurn()) && view.phase === 'action';
  [3, 2, 1].forEach(function(tier){
    var row = $('tier' + tier); row.innerHTML = '';
    var left = view.decks[tier].length;
    var deck = el('button', 'deck t' + tier + ' p' + (left > 24 ? 3 : left > 12 ? 2 : left > 0 ? 1 : 0));
    deck.setAttribute('data-fx', 'deck:' + tier);
    if (window.Art && Art.back) { var bk = el('span', 'back'); bk.innerHTML = Art.back(tier); deck.appendChild(bk); }
    deck.appendChild(el('span', 'lvl', ['', 'I', 'II', 'III'][tier]));
    deck.appendChild(el('span', 'cnt num', String(left)));
    block(deck, !active || !left || p.reserved.length >= S.MAX_RESERVED);
    deck.onclick = function(){ if (isBlocked(deck)) return refuse(deck); act({ type: 'reserve', tier: tier }); };
    row.appendChild(deck);
    view.board[tier].forEach(function(id, slot){
      if (!id) { var em = el('div', 'card empty'); em.setAttribute('data-fx', 'slot:' + tier + ':' + slot); row.appendChild(em); return; }
      var card = S.CARD_BY_ID[id];
      var ce = cardEl(card, { afford: S.canAfford(p, card) });
      ce.setAttribute('data-slot', tier + ':' + slot);
      ce.onclick = function(){ if (isBlocked(ce)) return refuse(ce); openSheet(card, 'board', ce); };
      row.appendChild(ce);
    });
  });
  // bank
  var bank = $('bank'); bank.innerHTML = '';
  S.COLORS.concat(['y']).forEach(function(c){
    var n0 = view.bank[c];
    var b = el('button', 'bankt ' + c + ' s' + (n0 === 0 ? 0 : n0 >= 4 ? 4 : n0) + (sel.indexOf(c) >= 0 ? ' sel' : ''));
    var big = el('span', 'big num', String(view.bank[c])); big.setAttribute('data-fx', 'bank:' + c); b.appendChild(big);
    var n = sel.filter(function(x){ return x === c; }).length;
    b.appendChild(el('span', 'pick', n ? '+' + n : ''));
    block(b, c === 'y' || !active || view.bank[c] === 0);
    b.onclick = function(){ if (isBlocked(b)) return refuse(b); pick(c); };
    bank.appendChild(b);
  });
  // action bar
  var hint = $('actionHint');
  if (view.phase === 'over') hint.textContent = '';
  else if (!active) hint.textContent = t('notYourTurnHint');
  else hint.textContent = sel.length ? '' : t('pickHint');
  var heldBox = $('held'); heldBox.innerHTML = ''; heldBox.hidden = !sel.length;
  sel.forEach(function(c){ heldBox.appendChild(el('span', 'tok ' + c)); });
  if (sel.length) hint.hidden = true; else hint.hidden = false;
  var stuck = active && !S.hasLegalAction(view, seat);
  if (stuck) hint.textContent = t('passHint');
  $('passBtnBar').hidden = !stuck;
  $('takeBtn').hidden = !sel.length; $('takeBtn').textContent = t('take') + ' (' + sel.length + ')';
  $('clearBtn').hidden = !sel.length;
  // move feed
  var feed = $('log'); feed.innerHTML = '';
  var recent = view.log.slice(-3);
  recent.forEach(function(e, i){
    var txt = logText(e); if (!txt) return;
    var line = el('div', 'feed-line' + (e.seat === seat ? ' mine' : '') + (i === recent.length - 1 ? ' now' : ''), txt);
    line.style.opacity = i === recent.length - 1 ? '1' : (0.34 + i * 0.12);
    feed.appendChild(line);
  });
  // phase dialogs
  $('discard').hidden = !(view.phase === 'discard' && (mode === 'local' || myTurn()));
  if (!$('discard').hidden) renderDiscard();
  $('nobleDlg').hidden = !(view.phase === 'noble' && (mode === 'local' || myTurn()));
  if (!$('nobleDlg').hidden) renderNoble();
  $('over').hidden = view.phase !== 'over';
  if (view.phase === 'over') renderOver();
  if (tut.on) renderTut();
  fitBoard();
}
function logText(e){
  var name = view.players[e.seat].name;
  switch (e.type) {
    case 'take': return t('log.take', { name: name, gems: e.colors.map(function(c){ return t('colors.' + c); }).join(', ') });
    case 'reserve': return t(e.hidden ? 'log.reserveDeck' : 'log.reserve', { name: name, tier: e.tier });
    case 'buy': var c = S.CARD_BY_ID[e.cardId]; return t('log.buy', { name: name, color: t('colors.' + c.color), pts: c.pts });
    case 'noble': return t('log.noble', { name: name });
    case 'discard': return t('log.discard', { name: name });
    case 'pass': return t('log.pass', { name: name });
  }
  return '';
}


/* ---------------- The physical layer: play what changed ---------------- */
// Every state change goes through applyView so the difference can be acted out
// before the new table is simply there.
function applyView(next, opts){
  opts = opts || {};
  var fx = window.FX;
  var first = !view;
  if (fx) fx.settle();            // never measure a table that is still moving
  var prev = view;
  var before = (fx && !first && !opts.silent) ? fx.capture() : null;
  var prevSeq = view ? (view.seq || 0) : -1;
  view = next;
  render();
  if (!fx || opts.silent) return;
  if (first) return ((next.seq || 0) === 0 && next.turn === 1) ? dealOpening() : undefined;
  if (next.phase === 'over' && !endPlayed) {
    endPlayed = true;
    var won = (mode === 'local' && !bot) ? next.winner != null : next.winner === seat;
    setTimeout(function(){ fx.play('end', { won: won }); fx.buzz(won ? 'win' : 'lose'); }, 420);
  }
  if (next.phase !== 'over') endPlayed = false;
  if (next.endTriggered && !lastRoundShown && next.phase !== 'over') {
    lastRoundShown = true;
    afterFx(function(){
      var b = $('banner');
      if (b && b.animate && !fx.reduced()) {
        try { b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.035)' }, { transform: 'scale(1)' }],
                        { duration: 520, easing: 'cubic-bezier(.3,1.3,.4,1)' }); } catch (e) {}
      }
      fx.play('knock', { level: 1 }); fx.buzz([20, 80, 20]);
    });
  }
  if (!next.endTriggered) lastRoundShown = false;
  var fresh = (next.log || []).filter(function(e){ return (e.seq || 0) > prevSeq; });
  // A rematch rewinds the counter, and a reconnect can hand over a pile of moves at once.
  // Neither is something to act out: just show the table as it stands.
  if ((next.seq || 0) < prevSeq || fresh.length > 3) return;
  if (fresh.length) playMoves(fresh, before, prev);
  afterFx(bannerBeat);
}

// Wait until the table has stopped moving, so a dialog never lands on top of a move.
function afterFx(fn, cap){
  var tries = 0, max = cap || 40;
  (function spin(){
    if (!window.FX || !FX.busy() || tries++ > max) return fn();
    setTimeout(spin, 90);
  })();
}
// In pass-and-play every move is on your side of the table; otherwise the opponent is across it.
function soundSide(entrySeat){
  if (mode === 'local' && !bot) return 'near';
  return entrySeat === seat ? 'near' : 'far';
}
var lastTurnKey = null;
// The banner hands the turn over after the objects have settled, not during the motion.
function bannerBeat(){
  var key = (view.phase === 'over' ? 'over' : view.current) + ':' + view.phase;
  if (key === lastTurnKey) return;
  lastTurnKey = key;
  var fx = window.FX; if (!fx || fx.reduced()) return;
  var b = $('banner'); if (!b || !b.animate) return;
  try { b.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: .45, transform: 'translateY(-3px)' },
                   { opacity: 1, transform: 'translateY(0)' }], { duration: 360, easing: 'ease-out' }); } catch (e) {}
}
// A tray's number must not tick up while the gem is still in the air.
function holdCount(key, oldText, landMs){
  var n = document.querySelector('[data-fx="' + key + '"]');
  if (!n) return;
  var target = n.textContent;
  if (target === String(oldText)) return;
  n.textContent = oldText;
  setTimeout(function(){
    var live = document.querySelector('[data-fx="' + key + '"]');
    if (!live) return;
    live.textContent = target;
    if (window.FX) FX.pop(live, 1.22);
  }, landMs);
}
function ghostOf(rect){ return rect && rect.el ? rect.el.outerHTML : ''; }
function tokenGhost(c){ return '<span class="tok ' + c + '"></span>'; }

// Lay the table out the way a person would: nobles first, then each row dealt left to right.
function dealOpening(){
  var fx = window.FX; if (!fx || fx.reduced()) return;
  var n = 0;
  document.querySelectorAll('#nobles .noble').forEach(function(el, i){
    fx.dealIn(el, { x: el.getBoundingClientRect().left, y: -90 }, { delay: i * 90, ms: 420 });
    fx.play('slide', { delay: (i * 90) / 1000, level: 0.5 });
  });
  [3, 2, 1].forEach(function(tier, row){
    var deckRect = fx.rectOf('deck:' + tier);
    document.querySelectorAll('#tier' + tier + ' .card').forEach(function(el, i){
      var d = 260 + row * 190 + i * 70;
      fx.dealIn(el, deckRect, { delay: d, ms: 400 });
      fx.play('slide', { delay: d / 1000, level: 0.55 });
      n++;
    });
  });
}

// Act out each move that has happened since this client last painted.
function playMoves(entries, before, prev){
  var fx = window.FX; if (!fx) return;
  var clock = 0;
  entries.forEach(function(e){
    var mine = e.seat === seat;
    var side = soundSide(e.seat), level = 1;
    switch (e.type) {
      case 'take': {
        var held = {};
        e.colors.forEach(function(c, i){
          var from = before && before['bank:' + c], to = fx.rectOf('ptok:' + e.seat + ':' + c);
          fx.fly(from, to, tokenGhost(c), { ms: 320, delay: clock + i * 80, cls: 'g-tok' });
          fx.play('gem', { color: c, delay: (clock + i * 80 + 250) / 1000, side: side });
          if (prev && held[c] == null) { held[c] = prev.players[e.seat].tokens[c]; }
        });
        Object.keys(held).forEach(function(c){
          var last = e.colors.lastIndexOf(c);
          var at = clock + last * 80 + 320;
          holdCount('ptok:' + e.seat + ':' + c, held[c], at);
          if (prev) holdCount('ptot:' + e.seat + ':' + c, S.bonuses(prev.players[e.seat])[c] + held[c], at);
        });
        clock += 320 + (e.colors.length - 1) * 80;
        break;
      }
      case 'discard': {
        var i2 = 0;
        for (var c2 in e.tokens) {
          for (var k = 0; k < e.tokens[c2]; k++) {
            var from2 = before && before['ptok:' + e.seat + ':' + c2], to2 = fx.rectOf('bank:' + c2);
            fx.fly(from2, to2, tokenGhost(c2), { ms: 300, delay: clock + i2 * 70, cls: 'g-tok' });
            fx.play('gem', { color: c2, delay: (clock + i2 * 70 + 230) / 1000, side: side, level: 0.8 });
            if (prev) holdCount('bank:' + c2, prev.bank[c2], clock + i2 * 70 + 300);
            i2++;
          }
        }
        clock += 300 + i2 * 70;
        break;
      }
      case 'buy': {
        var card = S.CARD_BY_ID[e.cardId];
        // What it cost this player, worked out from the hand they held a moment ago.
        var payer = prev && prev.players[e.seat];
        var pay = payer ? S.payment(payer, card) : null;
        var paid = 0;
        if (pay) {
          Object.keys(pay).forEach(function(pc){
            for (var q = 0; q < pay[pc]; q++) {
              fx.fly(before && before['ptok:' + e.seat + ':' + pc], fx.rectOf('bank:' + pc), tokenGhost(pc),
                     { ms: 260, delay: clock + Math.min(paid * 45, 260), cls: 'g-tok' });
              if (prev) holdCount('bank:' + pc, prev.bank[pc], clock + Math.min(paid * 45, 260) + 260);
              paid++;
            }
          });
        }
        // The card is only picked up once the payment is on its way.
        var lift = clock + (paid ? 110 : 0);
        var src = (before && (before['card:' + e.cardId] || before['res:' + e.cardId])) || null;
        var dst = fx.rectOf('pbonus:' + e.seat + ':' + card.color);
        fx.fly(src, dst, ghostOf(src), { ms: 400, delay: lift, rot1: -4 });
        fx.play('buy', { delay: (lift + 260) / 1000, side: side, cost: S.sum(card.cost) });
        var bonus = document.querySelector('[data-fx="pbonus:' + e.seat + ':' + card.color + '"]');
        setTimeout(function(){ fx.pop(bonus); }, lift + 400);
        clock = lift + 300;
        break;
      }
      case 'reserve': {
        var rsrc = e.cardId ? (before && before['card:' + e.cardId]) : fx.rectOf('deck:' + e.tier);
        var rdst = fx.rectOf('pres:' + e.seat) || fx.rectOf('ptok:' + e.seat + ':y');
        fx.fly(rsrc, rdst, e.cardId && rsrc ? ghostOf(rsrc) : '<div class="card hidden-card"></div>',
               { ms: 350, delay: clock, rot1: -6 });
        fx.play('slide', { delay: (clock + 120) / 1000, side: side });
        if (e.gold) {
          var gfrom = before && before['bank:y'], gto = fx.rectOf('ptok:' + e.seat + ':y');
          fx.fly(gfrom, gto, tokenGhost('y'), { ms: 320, delay: clock + 200, cls: 'g-tok' });
          if (prev) holdCount('ptok:' + e.seat + ':y', prev.players[e.seat].tokens.y, clock + 520);
          fx.play('gem', { color: 'y', delay: (clock + 450) / 1000, side: side });
        }
        clock += 320;
        break;
      }
      case 'noble': {
        var nsrc = before && before['noble:' + e.nobleId];
        var ndst = fx.rectOf('pnoble:' + e.seat) || fx.rectOf('pbonus:' + e.seat + ':w');
        fx.fly(nsrc, ndst, ghostOf(nsrc), { ms: 520, delay: clock + 180, lift: 34, easing: 'cubic-bezier(.4,0,.2,1)' });
        fx.play('noble', { delay: (clock + 420) / 1000, side: side });
        if (mine) fx.buzz('noble');
        clock += 420;
        break;
      }
      case 'pass': {
        fx.play('knock', { delay: clock / 1000, side: side });
        clock += 200;
        break;
      }
    }
  });
  // Any board card that was not on screen a moment ago has just been dealt from its deck.
  setTimeout(function(){ dealReplacements(before); }, Math.max(120, clock + 30));
}

function dealReplacements(before){
  var fx = window.FX; if (!fx || fx.reduced()) return;
  [1, 2, 3].forEach(function(tier){
    var deckRect = fx.rectOf('deck:' + tier);
    if (!deckRect) return;
    document.querySelectorAll('#tier' + tier + ' .card[data-fx]').forEach(function(el){
      var key = el.getAttribute('data-fx');
      if (before && before[key]) return;       // it was already on the table
      if (el.dataset.dealt === '1') return;
      el.dataset.dealt = '1';
      fx.dealIn(el, deckRect, { ms: 400 });
      fx.play('flip', { delay: 0.18, level: 0.5 });
    });
  });
}

/* ---------------- Press feedback ---------------- */
// Objects sink under the thumb and come back up, on both phones.
['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function(t){
  document.addEventListener(t, function(){ if (window.FX) FX.arm(); }, { capture: true, passive: true });
});
document.addEventListener('pointerdown', function(ev){
  var el = ev.target.closest && ev.target.closest('.card,.deck,.bankt,.noble');
  if (!el || isBlocked(el)) return;
  if (window.FX) FX.arm();
  el.classList.add('press');
}, { passive: true });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(t){
  document.addEventListener(t, function(ev){
    var el = ev.target.closest && ev.target.closest('.press');
    if (el) el.classList.remove('press');
    document.querySelectorAll('.press').forEach(function(n){ n.classList.remove('press'); });
  }, { passive: true });
});
// A blocked object refuses physically instead of doing nothing.
function refuse(el){
  if (!window.FX) return;
  FX.nudge(el); FX.play('deny', { level: 0.75 }); FX.buzz('deny');
}

/* ---------------- Gem selection ---------------- */
function pick(c){
  var was = sel.length;
  var count = sel.filter(function(x){ return x === c; }).length;
  if (count === 1 && sel.length === 1) {
    if (view.bank[c] >= 4) sel = [c, c]; else sel = [];
  } else if (count >= 1) {
    sel = sel.filter(function(x){ return x !== c; });
  } else {
    if (sel.length === 2 && sel[0] === sel[1]) sel = [c];
    else if (sel.length < 3) sel.push(c);
  }
  if (window.FX) {
    if (sel.length > was) { FX.play('gem', { color: c, level: 0.8 }); FX.buzz('pick'); }
    else if (sel.length < was) FX.play('tick', { level: 0.9 });
  }
  render();
}
$('takeBtn').onclick = function(){ if (sel.length) act({ type: 'take', colors: sel.slice() }); };
$('clearBtn').onclick = function(){ sel = []; render(); };
$('passBtnBar').onclick = function(){ act({ type: 'pass' }); };

/* ---------------- Card sheet ---------------- */
function openSheet(card, from, srcEl){
  sheetCard = { card: card, from: from };
  liftFrom = srcEl ? srcEl.getBoundingClientRect() : null;
  var p = me();
  $('sheetCard').innerHTML = ''; $('sheetCard').appendChild(cardEl(card));
  var cl = $('sheetCost'); cl.innerHTML = '';
  var b = S.bonuses(p);
  S.COLORS.forEach(function(c){
    if (!card.cost[c]) return;
    var line = el('div', 'line');
    line.appendChild(tokEl(c, card.cost[c]));
    var need = Math.max(0, card.cost[c] - b[c]);
    var txt = t('colors.' + c) + ' ' + card.cost[c];
    if (b[c]) txt += ' − ' + b[c];
    line.appendChild(el('span', 'need', txt));
    var have = p.tokens[c];
    line.appendChild(el('span', have >= need ? 'ok num' : 'short num', need ? (Math.min(have, need) + '/' + need) : '✓'));
    cl.appendChild(line);
  });
  var pay = S.payment(p, card);
  var v = $('sheetVerdict');
  var active = (mode === 'local' || myTurn()) && view.phase === 'action';
  if (!active) { v.className = 'verdict'; v.textContent = t('notTurn'); }
  else if (pay) { v.className = 'verdict good'; v.textContent = t('canBuy') + (pay.y ? ' · ' + t('usesGold', { n: pay.y }) : ''); }
  else { v.className = 'verdict bad'; v.textContent = t('cantBuy'); }
  $('buyBtn').disabled = !active || !pay;
  $('reserveBtn').hidden = from !== 'board';
  $('reserveBtn').disabled = !active || p.reserved.length >= S.MAX_RESERVED;
  $('reserveBtn').textContent = p.reserved.length >= S.MAX_RESERVED ? t('reserveFullHint') : t('reserve');
  $('sheet').hidden = false;
  liftCard();
  tutWatchSheet();
}
var liftFrom = null;
// The sheet's card rises out of the card you actually touched, rather than appearing from nowhere.
function liftCard(){
  var fx = window.FX; if (!fx || fx.reduced() || !liftFrom) return;
  var big = $('sheetCard').firstChild; if (!big || !big.animate) return;
  var b = big.getBoundingClientRect();
  if (!b.width) return;
  var sx = liftFrom.width / b.width, sy = liftFrom.height / b.height;
  try {
    big.animate([
      { transform: 'translate(' + (liftFrom.left - b.left) + 'px,' + (liftFrom.top - b.top) + 'px) scale(' + sx + ',' + sy + ')', opacity: 0.6 },
      { transform: 'none', opacity: 1 }
    ], { duration: 280, easing: 'cubic-bezier(.2,.85,.3,1)' });
  } catch (e) {}
  fx.play('slide', { level: 0.5 });
}
function closeSheet(){ $('sheet').hidden = true; sheetCard = null; liftFrom = null; }
$('sheetClose').onclick = closeSheet;
$('sheet').addEventListener('click', function(e){ if (e.target === $('sheet')) closeSheet(); });
$('buyBtn').onclick = function(){ if (!sheetCard) return; var c = sheetCard.card; closeSheet(); act({ type: 'buy', cardId: c.id }); };
$('reserveBtn').onclick = function(){ if (!sheetCard) return; var c = sheetCard.card; closeSheet(); act({ type: 'reserve', tier: c.tier, cardId: c.id }); };

/* ---------------- Discard ---------------- */
function renderDiscard(){
  var p = me(); var excess = S.sum(p.tokens) - S.MAX_TOKENS;
  if (!ret) ret = { w: 0, u: 0, g: 0, r: 0, k: 0, y: 0 };
  var chosen = S.sum(ret);
  $('discardHint').textContent = t('discardHint', { n: excess }) + ' · ' + chosen + '/' + excess;
  var sp = $('stepper'); sp.innerHTML = '';
  S.COLORS.concat(['y']).forEach(function(c){
    var st = el('div', 'st');
    st.appendChild(tokEl(c, p.tokens[c] - ret[c]));
    st.appendChild(el('span', 'ret num', ret[c] ? '−' + ret[c] : ''));
    var pm = el('div', 'pm');
    var minus = el('button', null, '−'); minus.disabled = !ret[c]; minus.onclick = function(){ ret[c]--; renderDiscard(); };
    var plus = el('button', null, '+'); plus.disabled = chosen >= excess || ret[c] >= p.tokens[c]; plus.onclick = function(){ ret[c]++; renderDiscard(); };
    pm.appendChild(minus); pm.appendChild(plus); st.appendChild(pm);
    sp.appendChild(st);
  });
  $('discardBtn').disabled = chosen !== excess;
}
$('discardBtn').onclick = function(){ var r = ret; ret = null; act({ type: 'discard', tokens: r }); };

/* ---------------- Noble choice ---------------- */
function renderNoble(){
  var nc = $('nobleChoice'); nc.innerHTML = '';
  (view.pendingNobles || []).forEach(function(id){
    var b = el('button'); b.appendChild(nobleEl(S.NOBLE_BY_ID[id], true));
    b.onclick = function(){ act({ type: 'noble', nobleId: id }); };
    nc.appendChild(b);
  });
}

/* ---------------- Game over ---------------- */
function renderOver(){
  var reason = meta.over && meta.over.reason;
  if (reason === 'left') {
    $('overText').textContent = meta.over.winner === seat
      ? t('overLeft', { name: opp().name })
      : t('overYouLeft');
  } else if (reason === 'abandoned') {
    $('overText').textContent = meta.over.winner === seat ? t('overAbandoned') : t('overYouLeft');
  } else {
    $('overText').textContent = view.winner == null ? t('draw') : t('wins', { name: view.players[view.winner].name });
  }
  var sc = $('scores'); sc.innerHTML = '';
  view.players.forEach(function(p, i){
    var line = el('div', 'line' + (view.winner === i ? ' win' : ''));
    line.appendChild(el('span', 'n', p.name));
    var s = el('span', 's num', String(p.points)); s.appendChild(el('small', null, t('cards', { n: p.cards.length })));
    line.appendChild(s); sc.appendChild(line);
  });
  var asked = mode === 'online' && meta.rematch.indexOf(seat) >= 0;
  var oppAsked = mode === 'online' && meta.rematch.indexOf(1 - seat) >= 0;
  // A game somebody walked out of cannot be replayed from here; both go back to the lobby.
  $('rematchBtn').hidden = mode === 'online' && !!reason;
  $('rematchBtn').disabled = asked;
  $('rematchNote').hidden = !(asked || oppAsked);
  $('rematchNote').textContent = asked ? t('rematchWait') : oppAsked ? t('rematchAsked', { name: opp().name }) : '';
}
$('rematchBtn').onclick = function(){
  if (mode === 'local') { startLocal(bot); return; }
  if (mode === 'p2p' && p2p.role === 'host') { hostRematch(0); return; }
  send({ t: 'rematch' });
};
$('overLeave').onclick = leave;

/* ---------------- Actions ---------------- */
function act(action){
  sel = [];
  if (mode === 'local') {
    try {
      var before = localState.current;
      localState = S.apply(localState, seat, action);
      var done = localState.phase === 'action' && localState.current !== before || localState.phase === 'over';
      if (!bot) seat = localState.current;
      applyView(S.viewFor(localState, seat));
      if (done && localState.phase !== 'over' && !bot) afterFx(function(){
        $('passText').textContent = t('pass', { name: localState.players[seat].name });
        var lastEntry = localState.log[localState.log.length - 1];
        $('passRecap').textContent = lastEntry ? logText(lastEntry) : '';
        $('pass').hidden = false;
      });
      if (tutScripted() && localState.current === 1 && localState.phase === 'action') {
        localState.current = 0;           // the computer waits while a lesson is being driven
        view = S.viewFor(localState, 0);
        render();
      } else if (bot && localState.current === 1 && localState.phase !== 'over') {
        setTimeout(botTurn, botPause());
      }
      saveLocal();
    } catch (e) { toast(t('err.' + (e.code || 'invalidAction'))); render(); }
    return;
  }
  if (mode === 'p2p' && p2p.role === 'host') { hostApply(0, action); return; }
  send({ t: 'action', action: action });
  render();
}
function saveLocal(){
  try {
    if (mode === 'local' && localState && localState.phase !== 'over')
      localStorage.setItem('splendor.local', JSON.stringify({ state: localState, bot: bot, seat: seat, at: Date.now(), tut: tut.on }));
    else localStorage.removeItem('splendor.local');
  } catch(e){}
}
function loadLocal(){ try { return JSON.parse(localStorage.getItem('splendor.local') || 'null'); } catch(e){ return null; } }
function refreshResume(){ var sv = loadLocal(); $('resumeBtn').hidden = !(sv && sv.state && sv.state.phase !== 'over'); }
function resumeLocal(sv){
  if (!sv) return false;
  mode = 'local'; bot = !!sv.bot; localState = sv.state; seat = bot ? 0 : localState.current;
  view = null; sel = []; ret = null; meta = { code: null, players: [], rematch: [] };
  show('game'); applyView(S.viewFor(localState, seat));
  if (bot && localState.current === 1) setTimeout(botTurn, botPause());
  return true;
}
$('resumeBtn').onclick = function(){ resumeLocal(loadLocal()); };
$('passBtn').onclick = function(){ $('pass').hidden = true; };

/* ---------------- Local mode ---------------- */
function startLocal(withBot){
  mode = 'local'; bot = !!withBot;
  var n = $('name').value.trim();
  localState = S.newGame([n || t('p1'), bot ? t('tut.bot') : t('p2')]);
  seat = 0; view = null; sel = []; ret = null; meta = { code: null, players: [], rematch: [] };
  show('game'); applyView(S.viewFor(localState, 0)); saveLocal();
}
$('localBtn').onclick = function(){ endTut(); startLocal(false); };
$('tutBtn').onclick = function(){ startLocal(true); startTut(); };
$('botBtn').onclick = function(){ endTut(); startLocal(true); };

/* ---------------- Computer opponent (tutorial) ---------------- */
function botAction(s){
  var p = s.players[1], c, i, tier;
  if (s.phase === 'discard') {
    var excess = S.sum(p.tokens) - S.MAX_TOKENS, give = { w: 0, u: 0, g: 0, r: 0, k: 0, y: 0 };
    var order = S.COLORS.slice().sort(function(a, b){ return p.tokens[b] - p.tokens[a]; });
    for (i = 0; i < order.length && excess > 0; i++) { var n = Math.min(excess, p.tokens[order[i]]); give[order[i]] = n; excess -= n; }
    if (excess > 0) give.y = excess;
    return { type: 'discard', tokens: give };
  }
  if (s.phase === 'noble') return { type: 'noble', nobleId: s.pendingNobles[0] };
  var best = null, bestScore = -1;
  var pool = [];
  for (tier = 1; tier <= 3; tier++) s.board[tier].forEach(function(id){ if (id) pool.push(S.CARD_BY_ID[id]); });
  p.reserved.forEach(function(r){ pool.push(S.CARD_BY_ID[r.id]); });
  pool.forEach(function(card){ if (S.canAfford(p, card)) { var sc = card.pts * 10 + card.tier; if (sc > bestScore) { bestScore = sc; best = card; } } });
  if (best) return { type: 'buy', cardId: best.id };
  // Aim at the card with the smallest shortfall and take the colors it needs.
  var b = S.bonuses(p), target = null, targetShort = 99, needColors = [];
  pool.forEach(function(card){
    var short = 0, cols = [];
    S.COLORS.forEach(function(c){ var d = Math.max(0, (card.cost[c] || 0) - b[c] - p.tokens[c]); if (d > 0) { short += d; cols.push(c); } });
    if (short < targetShort) { targetShort = short; target = card; needColors = cols; }
  });
  var room = S.MAX_TOKENS - S.sum(p.tokens);
  var pick = needColors.filter(function(c){ return s.bank[c] > 0; });
  if (pick.length === 1 && s.bank[pick[0]] >= 4 && room >= 2) return { type: 'take', colors: [pick[0], pick[0]] };
  S.COLORS.forEach(function(c){ if (pick.length < 3 && pick.indexOf(c) < 0 && s.bank[c] > 0) pick.push(c); });
  pick = pick.slice(0, Math.max(0, Math.min(3, room)));
  if (pick.length) return { type: 'take', colors: pick };
  if (p.reserved.length < S.MAX_RESERVED) for (tier = 1; tier <= 3; tier++) if (s.decks[tier].length) return { type: 'reserve', tier: tier };
  return { type: 'pass' };
}
// The beat before the computer reaches for the table.
function botPause(){ return 620; }
// A cheap gem grab is quick; committing to an expensive card looks like deliberation.
function botThink(action){
  if (!action) return 400;
  if (action.type === 'buy') { var c = S.CARD_BY_ID[action.cardId]; return 520 + (c ? c.tier * 340 : 0); }
  if (action.type === 'reserve') return 900;
  if (action.type === 'discard' || action.type === 'noble') return 450;
  return 420;
}
function botTurn(){
  if (tutScripted()) return;
  if (!bot || !localState || localState.current !== 1 || localState.phase === 'over') return;
  // Never move on top of the previous move still sliding across the table.
  if (window.FX && FX.busy()) return setTimeout(botTurn, 220);
  var planned = null;
  try { planned = botAction(localState); } catch (e) {}
  var wait = botThink(planned);
  if (window.FX && FX.reduced()) wait = 120;
  setTimeout(function(){ botCommit(planned); }, wait);
}
function botCommit(planned){
  if (!bot || !localState || localState.current !== 1 || localState.phase === 'over') return;
  try { localState = S.apply(localState, 1, planned || botAction(localState)); }
  catch (e) { try { localState = S.apply(localState, 1, { type: 'pass' }); } catch (e2) { return; } }
  applyView(S.viewFor(localState, 0)); saveLocal();
  if (localState.current === 1 && localState.phase !== 'over') setTimeout(botTurn, botPause());
}

/* ---------------- Tutorial ---------------- */
// Each step: a target to spotlight and, for action steps, a test that says when the player has done it.
// Each step points at one thing. Where a step teaches an action, only that action
// is allowed until it is done, so a beginner cannot wander off mid-lesson.
var TUT = [
  { id: 'goal',     at: function(){ return $('me'); } },
  { id: 'rows',     at: function(){ return $('tier1'); } },
  { id: 'cardPts',  at: function(){ return document.querySelector('#tier3 .card .pts'); }, pad: 10 },
  { id: 'cardGem',  at: function(){ return document.querySelector('#tier3 .card .gem'); }, pad: 10 },
  { id: 'cardCost', at: function(){ return document.querySelector('#tier3 .card .cost'); }, pad: 6 },
  { id: 'bank',     at: function(){ return $('bank'); } },
  { id: 'myPanel',  at: function(){ return document.querySelector('#me .wallet'); } },
  { id: 'nobles',   at: function(){ return $('nobles'); } },
  { id: 'take3',    at: function(){ return $('bank'); },
                    allow: ['#bank .bankt.w', '#bank .bankt.u', '#bank .bankt.g', '#takeBtn', '#clearBtn'],
                    done: function(e){ return e.type === 'take' && e.colors.length === 3; } },
  { id: 'oppTake',  at: function(){ return $('opp'); }, watch: true },
  { id: 'take2',    before: pickPairColour, skipIf: function(){ return !tut.pairColor; },
                    at: function(){ return document.querySelector('#bank .bankt.' + tut.pairColor); },
                    allow: [function(){ return document.querySelector('#bank .bankt.' + tut.pairColor); }, '#takeBtn', '#clearBtn'],
                    done: function(e){ return e.type === 'take' && e.colors.length === 2; } },
  { id: 'oppTurn2', at: function(){ return $('opp'); }, watch: true },
  { id: 'buyPick',  before: rigAffordable, at: tutCardEl, allow: [tutCardEl],
                    ready: function(){ return !$('sheet').hidden; } },
  { id: 'buyDo',    at: function(){ return $('buyBtn'); }, allow: ['#buyBtn'],
                    done: function(e){ return e.type === 'buy'; } },
  { id: 'bonus',    at: function(){
                      return document.querySelector('[data-fx="ptot:0:' + (tut.boughtColor || 'w') + '"]');
                    }, pad: 8 },
  { id: 'oppBuy',   at: function(){ return $('opp'); }, watch: true },
  { id: 'reserveCard', before: pickReserveTarget, at: tutReserveEl, allow: [tutReserveEl],
                    ready: function(){ return !$('sheet').hidden; } },
  { id: 'reserveDo', at: function(){ return $('reserveBtn'); }, allow: ['#reserveBtn'],
                    done: function(e){ return e.type === 'reserve' && !e.hidden; } },
  { id: 'oppTurn3', at: function(){ return $('opp'); }, watch: true },
  { id: 'reserveDeck', at: function(){ return document.querySelector('#tier3 .deck'); },
                    allow: ['#tier3 .deck'],
                    done: function(e){ return e.type === 'reserve' && e.hidden; } },
  { id: 'gold',     at: function(){ return document.querySelector('[data-fx="ptot:0:y"]'); }, pad: 10 },
  { id: 'limit',    at: function(){ return document.querySelector('#me .wallet'); } },
  { id: 'plan',     at: function(){ return $('tier1'); } },
  { id: 'end',      at: null }
];

function tutStep(){ return TUT[tut.step] || null; }
// The computer holds off during the lessons the learner drives, and plays on the
// steps that exist to be watched.
function tutScripted(){
  if (!tut.on || tut.step >= TUT.length - 1) return false;
  var st = tutStep();
  return !(st && st.watch);
}
function tutCardEl(){ return tut.cardId ? document.querySelector('[data-fx="card:' + tut.cardId + '"]') : null; }
function tutReserveEl(){ return tut.reserveId ? document.querySelector('[data-fx="card:' + tut.reserveId + '"]') : null; }

// Two of a kind needs four in the bank, and the computer may have taken the colour
// this lesson used to assume. Find one that still qualifies.
function pickPairColour(){
  tut.pairColor = null;
  if (!localState) return;
  var best = null;
  S.COLORS.forEach(function(c){
    if (localState.bank[c] < 4) return;
    if (best === null || localState.bank[c] > localState.bank[best]) best = c;
  });
  tut.pairColor = best;
}

// A card worth denying: the dearest one on the board that the learner cannot buy yet.
function pickReserveTarget(){
  if (!localState) return;
  var p = localState.players[0], best = null;
  [3, 2, 1].forEach(function(tier){
    localState.board[tier].forEach(function(id){
      if (!id || best) return;
      var card = S.CARD_BY_ID[id];
      if (S.canAfford(p, card)) return;
      best = id;
    });
  });
  tut.reserveId = best || (localState.board[3][0] || localState.board[2][0] || localState.board[1][0]);
}

// Top the player up so one board card is genuinely affordable, taking the gems
// out of the bank so nothing is conjured from nowhere.
function rigAffordable(){
  if (!localState) return;
  var p = localState.players[0], best = null;
  [1, 2, 3].forEach(function(tier){
    localState.board[tier].forEach(function(id){
      if (!id) return;
      var card = S.CARD_BY_ID[id], b = S.bonuses(p), miss = {}, total = 0, ok = true;
      S.COLORS.forEach(function(c){
        var want = Math.max(0, (card.cost[c] || 0) - b[c] - p.tokens[c]);
        if (want > localState.bank[c]) ok = false;
        if (want) { miss[c] = want; total += want; }
      });
      if (!ok) return;
      if (S.sum(p.tokens) + total > S.MAX_TOKENS) return;
      if (!best || total < best.total) best = { id: id, miss: miss, total: total };
    });
  });
  if (!best) return;
  for (var c in best.miss) { localState.bank[c] -= best.miss[c]; p.tokens[c] += best.miss[c]; }
  tut.cardId = best.id;
  tut.rigged = best.total > 0;
  view = S.viewFor(localState, 0);
  render();
}

function startTut(){
  tut = { on: true, step: 0, seq: 0, side: null, cardId: null, reserveId: null, pairColor: null, boughtColor: null, rigged: false, oppDid: null, oppMoved: false };
  document.body.classList.add('tut-on');
  $('coach').hidden = false;
  afterFx(function(){ enterStep(0); });
}
function enterStep(i){
  tut.step = i;
  tut.seq = view ? (view.seq || 0) : 0;
  tut.side = null;
  tut.oppMoved = false;
  var st = tutStep();
  if (st && st.before) st.before();
  if (st && st.skipIf && st.skipIf()) return enterStep(i + 1);
  // The lesson decides whose turn it is: yours to act, the computer's to be watched.
  if (st && localState && localState.phase === 'action') {
    var want = st.watch ? 1 : 0;
    if (localState.current !== want) {
      localState.current = want;
      view = S.viewFor(localState, 0);
      render();
    }
    if (st.watch) setTimeout(function(){ if (tut.on && tut.step === i) botTurn(); }, 700);
  }
  paintCoach(true);
  requestAnimationFrame(function(){ if (tut.on && tut.step === i) paintCoach(false); });
}
function endTut(){
  tut.on = false;
  document.body.classList.remove('tut-on', 'coach-at-top', 'coach-at-bottom');
  $('coach').hidden = true;
  clearLock();
  if ($('actionbar')) $('actionbar').style.bottom = '';
}
$('coachQuit').onclick = endTut;
$('coachNext').onclick = function(){
  if (tut.step >= TUT.length - 1) return endTut();
  enterStep(tut.step + 1);
};

// Called after every repaint: move the spotlight, and advance when the lesson is done.
function renderTut(){
  if (!tut.on) return;
  var st = tutStep();
  if (st && st.watch && !tut.oppMoved) {
    var theirs = (view.log || []).filter(function(e){ return (e.seq || 0) > tut.seq && e.seat === 1; });
    if (theirs.length) {
      tut.oppDid = theirs[theirs.length - 1];
      // Let the move land, then wait to be read rather than rushing on.
      return afterFx(function(){ if (tut.on) { tut.oppMoved = true; paintCoach(true); } });
    }
  }
  if (st && st.done) {
    var fresh = (view.log || []).filter(function(e){ return (e.seq || 0) > tut.seq && e.seat === 0; });
    for (var i = 0; i < fresh.length; i++) {
      if (st.done(fresh[i])) {
        if (fresh[i].type === 'buy') tut.boughtColor = S.CARD_BY_ID[fresh[i].cardId].color;
        return afterFx(function(){ enterStep(tut.step + 1); });
      }
    }
  }
  paintCoach(true);
}
// buyPick advances on opening the sheet rather than on a logged move.
function tutWatchSheet(){
  var st = tutStep();
  if (tut.on && st && st.ready && st.ready()) enterStep(tut.step + 1);
}

function allowedEls(){
  var st = tutStep();
  if (!st || !st.allow) return null;
  var out = [];
  st.allow.forEach(function(a){
    if (typeof a === 'function') { var e = a(); if (e) out.push(e); }
    else Array.prototype.forEach.call(document.querySelectorAll(a), function(e){ out.push(e); });
  });
  return out;
}
function clearLock(){
  Array.prototype.forEach.call(document.querySelectorAll('.tut-dim,.tut-glow'), function(e){
    e.classList.remove('tut-dim', 'tut-glow');
  });
}
function applyLock(){
  clearLock();
  var allow = allowedEls();
  if (!allow) return;
  var all = document.querySelectorAll('#game .card, #game .deck, #game .bankt, #game .noble, .actionbar button, .sheet .actions button, .topbar button');
  Array.prototype.forEach.call(all, function(e){
    if (allow.indexOf(e) >= 0) e.classList.add('tut-glow');
    else e.classList.add('tut-dim');
  });
  allow.forEach(function(e){ e.classList.add('tut-glow'); });
}
// A tap outside the lesson is refused, with a reason.
document.addEventListener('click', function(ev){
  if (!tut.on) return;
  var allow = allowedEls();
  if (!allow) return;
  var btn = ev.target.closest && ev.target.closest('button');
  if (!btn || btn.closest('.coach')) return;
  for (var i = 0; i < allow.length; i++) if (allow[i] === btn || allow[i].contains(btn)) return;
  ev.preventDefault(); ev.stopPropagation();
  if (window.FX) { FX.nudge(btn); FX.play('deny', { level: 0.6 }); }
  toast(t('tut.notNow'));
}, true);

/* ---- drawing the spotlight and the arrow ---- */
// Name what the computer just did, so the step has something concrete to point at.
function oppMoveLine(){
  var e = tut.oppDid;
  if (!e) return '';
  if (e.type === 'take') return t('tut.oppTook', { gems: e.colors.map(function(c){ return t('colors.' + c); }).join(', ') });
  if (e.type === 'buy') return t('tut.oppBought', { color: t('colors.' + S.CARD_BY_ID[e.cardId].color) });
  if (e.type === 'reserve') return t('tut.oppReserved');
  return '';
}
function coachFill(str){
  return String(str).replace(/\{color\}/g, tut.pairColor ? t('colors.' + tut.pairColor) : '');
}
function coachRect(el){
  if (!el || !el.getBoundingClientRect) return null;
  var r = el.getBoundingClientRect();
  return (r.width && r.height) ? r : null;
}
// `settled` true means: draw where things are. False means: this is the first paint of a
// step, so scroll the target into the band the card does not cover, then draw.
function paintCoach(settled){
  if (!tut.on) return;
  var st = tutStep(); if (!st) return;
  var txt = I18N[lang].tut.s[st.id] || I18N.en.tut.s[st.id] || { h: '', p: '' };
  $('coachTitle').textContent = txt.h;
  var body = (st.id === 'buyPick' && !tut.rigged && txt.p2) ? txt.p2 : txt.p;
  $('coachText').innerHTML = coachFill(body);
  $('coachStep').textContent = (tut.step + 1) + ' / ' + TUT.length;
  $('coachCard').setAttribute('data-step', st.id);
  var acting = !!st.allow;
  var waitingOnThem = !!st.watch && !tut.oppMoved;
  $('coachDo').textContent = acting ? coachFill(txt.do || '')
    : waitingOnThem ? t('tut.watching')
    : (st.watch ? coachFill(oppMoveLine()) : '');
  $('coachNext').hidden = acting || waitingOnThem;
  $('coachNext').textContent = tut.step === TUT.length - 1 ? t('tut.done') : t('tut.next');
  applyLock();

  var svg = $('coachSvg'), card = $('coachCard');
  var W = window.innerWidth, H = window.innerHeight;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var el = st.at ? st.at() : null;
  var r = coachRect(el);

  // The side is decided once per step, so the card never flips back and forth.
  if (r && tut.side == null) tut.side = ((r.top + r.height / 2) < H * 0.52) ? 'bottom' : 'top';
  var below = tut.side !== 'top';
  document.body.classList.toggle('coach-at-bottom', below);
  document.body.classList.toggle('coach-at-top', !below);
  card.style.top = below ? '' : 'calc(12px + env(safe-area-inset-top,0px))';
  card.style.bottom = below ? 'calc(12px + env(safe-area-inset-bottom,0px))' : '';

  if (!el) { svg.innerHTML = ''; return; }
  r = coachRect(el) || r;
  if (!r) { svg.innerHTML = ''; return; }

  var cr = card.getBoundingClientRect();
  if (!settled) {
    var covered = r.bottom > cr.top - 8 && r.top < cr.bottom + 8;
    if (covered) {
      // The card is sitting on what it is explaining: put it on the other side.
      tut.side = below ? 'top' : 'bottom';
      return requestAnimationFrame(function(){ paintCoach(true); });
    }
    var room = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (room > 4) {
      var bandTop = below ? 10 : cr.bottom + 18;
      var bandBot = below ? cr.top - 18 : H - 10;
      var shift = 0;
      if (r.top < bandTop) shift = r.top - bandTop - 8;
      else if (r.bottom > bandBot) shift = r.bottom - bandBot + 8;
      if (Math.abs(shift) > 4) {
        try { window.scrollBy({ top: shift, behavior: FX && FX.reduced() ? 'auto' : 'smooth' }); }
        catch (e) { window.scrollBy(0, shift); }
        return requestAnimationFrame(function(){ paintCoach(true); });
      }
    }
  }

  var pad = st.pad == null ? 6 : st.pad;
  var x = r.left - pad, y = r.top - pad, w = r.width + pad * 2, h = r.height + pad * 2;
  var holes = [{ x: x, y: y, w: w, h: h, main: true }];
  (allowedEls() || []).forEach(function(a){
    var ar = coachRect(a);
    if (!ar) return;
    // Skip anything already inside the main hole.
    if (ar.left >= x && ar.top >= y && ar.right <= x + w && ar.bottom <= y + h) return;
    holes.push({ x: ar.left - 5, y: ar.top - 5, w: ar.width + 10, h: ar.height + 10, main: false });
  });
  var from = { x: W / 2, y: below ? cr.top - 6 : cr.bottom + 6 };
  var to = { x: x + w / 2, y: below ? y + h + 10 : y - 10 };
  var midY = (from.y + to.y) / 2;
  var ctrlX = (from.x + to.x) / 2 + (to.x - from.x) * 0.15;
  var path = 'M' + from.x + ',' + from.y + ' Q' + ctrlX + ',' + midY + ' ' + to.x + ',' + to.y;
  var ang = Math.atan2(to.y - midY, to.x - ctrlX);
  var head = [
    [to.x, to.y],
    [to.x - 11 * Math.cos(ang - 0.42), to.y - 11 * Math.sin(ang - 0.42)],
    [to.x - 11 * Math.cos(ang + 0.42), to.y - 11 * Math.sin(ang + 0.42)]
  ].map(function(q){ return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');

  function holeRect(o){
    return '<rect x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + o.h + '" rx="10" fill="#000"/>';
  }
  function ringRect(o){
    return '<rect class="coach-ring" x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + o.h +
      '" rx="10" fill="none" stroke="#f0cf7a" stroke-width="' + (o.main ? 2.5 : 2) + '"' +
      (o.main ? '' : ' stroke-dasharray="7 5"') + '/>';
  }
  svg.innerHTML =
    '<defs><mask id="coachMask">' +
      '<rect width="' + W + '" height="' + H + '" fill="#fff"/>' +
      holes.map(holeRect).join('') +
    '</mask></defs>' +
    '<rect width="' + W + '" height="' + H + '" fill="rgba(8,6,12,.45)" mask="url(#coachMask)"/>' +
    holes.map(ringRect).join('') +
    '<path d="' + path + '" fill="none" stroke="#f0cf7a" stroke-width="2.5" stroke-linecap="round" opacity=".95"/>' +
    '<polygon points="' + head + '" fill="#f0cf7a"/>';
}
window.addEventListener('resize', function(){ if (tut.on) paintCoach(true); });
window.addEventListener('scroll', function(){ if (tut.on) paintCoach(true); }, { passive: true });

/* ---------------- Account, friends and online play ---------------- */
var account = null;      // {userId, name, token}
var friends = [];        // [{id, name}] kept on this device only
var onlineIds = [];
var incoming = null;     // an invitation waiting for my answer
var outgoing = null;     // an invitation I sent

function loadJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch(e){ return fallback; } }
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function myName(){ return account ? account.name : ($('name').value.trim() || t('p1')); }
function prettyCode(id){ return String(id || '').toUpperCase().replace(/(.{4})(?=.)/g, '$1-'); }
function normCode(s){ return String(s || '').toLowerCase().replace(/[^0-9a-f]/g, '').slice(0, 12); }

function send(msg){
  if (mode === 'p2p') { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(msg)); else toast(t('peerLost')); return; }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); else toast(t('err.noServer'));
}

/* ---- connection ---- */
function connect(onReady){
  if (ws && ws.readyState === 1) { onReady && onReady(); return; }
  if (ws && ws.readyState === 0) { pendingOpen = onReady; return; }
  pendingOpen = onReady;
  $('conn').hidden = false;
  $('conn').textContent = t(account ? 'reconnecting' : 'connecting');
  var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  try { ws = new WebSocket(url); }
  catch (e) { $('conn').hidden = true; toast(t('err.noServer')); pendingOpen = null; return; }
  ws.onopen = function(){
    backoff = 1000;
    if (account && account.token) ws.send(JSON.stringify({ t: 'auth', token: account.token, name: account.name }));
    else $('conn').hidden = true;
    var cb = pendingOpen; pendingOpen = null;
    if (cb) cb();
  };
  ws.onmessage = function(ev){ var m; try { m = JSON.parse(ev.data); } catch(e){ return; } onMessage(m); };
  ws.onclose = function(ev){
    ws = null;
    // 4001 means this account signed in somewhere else; do not fight over the socket.
    if (ev.code === 4001) { $('conn').hidden = true; toast(t('err.sessionExpired')); signOut(true); return; }
    if (account) {
      $('conn').hidden = false;
      $('conn').textContent = t('reconnecting');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(function(){ connect(); }, backoff);
      backoff = Math.min(backoff * 2, 10000);
    } else {
      $('conn').hidden = true;
      if (pendingOpen) { pendingOpen = null; toast(t('err.noServer')); }
    }
  };
  ws.onerror = function(){ /* close follows */ };
}

function onMessage(m){
  switch (m.t) {
    case 'auth': {
      account = { userId: m.userId, name: m.name, token: m.token };
      saveJSON('splendor.account', account);
      $('conn').hidden = true;
      paintHome();
      sendWatch();
      break;
    }
    case 'loggedOut':
      break;
    case 'presence':
      onlineIds = m.online || [];
      paintFriends();
      break;
    case 'invited':
      if (mode === 'online' && view && view.phase !== 'over') { send({ t: 'inviteDecline', from: m.from.id }); break; }
      incoming = m.from;
      rememberFriend(m.from.id, m.from.name);
      $('inviteInText').textContent = t('invite.incoming', { name: m.from.name });
      $('inviteIn').hidden = false;
      if (window.FX) { FX.play('noble', { level: 0.8 }); FX.buzz('noble'); }
      break;
    case 'inviteOff':
      if (incoming && incoming.id === m.from) { incoming = null; $('inviteIn').hidden = true; }
      break;
    case 'inviteSent':
      break;
    case 'inviteDeclined':
      outgoing = null; $('inviteOut').hidden = true;
      toast(t('invite.declined', { name: m.by.name }));
      break;
    case 'state': {
      // The same handler serves the peer-to-peer channel, where the mode must stand.
      if (mode !== 'p2p') mode = 'online';
      outgoing = null; $('inviteOut').hidden = true;
      incoming = null; $('inviteIn').hidden = true;
      meta.code = m.room; meta.players = m.players || []; meta.rematch = m.rematch || [];
      meta.over = m.over || null; meta.canClaim = !!m.canClaim;
      seat = m.seat;
      if (!m.state) { $('waitCode').textContent = m.room; show('wait'); return; }
      var foe = meta.players[1 - m.seat];
      if (foe && foe.id) rememberFriend(foe.id, foe.name);
      var wasPlaying = $('game').classList.contains('on');
      var prevPhase = view && view.phase;
      sel = [];
      if (prevPhase !== 'discard' && m.state.phase !== 'discard') ret = null;
      if (!wasPlaying) { show('game'); view = null; }
      applyView(m.state);
      if (!wasPlaying && m.state.log && m.state.log.length) toast(t('backInGame'), true);
      break;
    }
    case 'left':
      mode = null; view = null; meta = { code: null, players: [], rematch: [] };
      $('over').hidden = true;
      show('lobby'); paintHome();
      break;
    case 'err':
      if (m.code === 'sessionExpired') { signOut(true); }
      if (m.code === 'inviteGone') { incoming = null; $('inviteIn').hidden = true; }
      if (m.code === 'friendOffline' || m.code === 'friendBusy' || m.code === 'alreadyPlaying') {
        outgoing = null; $('inviteOut').hidden = true;
      }
      toast(t('err.' + m.code));
      if (view) render();
      break;
  }
}

/* ---- friends (kept on this device) ---- */
function rememberFriend(id, name){
  id = normCode(id);
  if (!id || (account && id === account.userId)) return false;
  var found = null;
  for (var i = 0; i < friends.length; i++) if (friends[i].id === id) found = friends[i];
  if (found) { if (name) { found.name = name; saveJSON('splendor.friends', friends); paintFriends(); } return false; }
  friends.push({ id: id, name: name || '' });
  saveJSON('splendor.friends', friends);
  sendWatch();
  paintFriends();
  return true;
}

  if (ws && ws.readyState === 1 && account) ws.send(JSON.stringify({ t: 'watch', ids: friends.map(function(f){ return f.id; }) }));

/* ---------------- Direct connection (WebRTC data channel, codes swapped by hand) ---------------- */
var ICE = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }
] };
var pc = null, dc = null;
var p2p = { role: null, connected: false, peerName: '', rematch: [] };

function b64u(bytes){ var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(str){ str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; var bin = atob(str), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function pump(stream){ return new Response(stream).arrayBuffer().then(function(ab){ return new Uint8Array(ab); }); }
function encodeCode(obj){
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return Promise.resolve('SP0.' + b64u(bytes));
  var cs = new CompressionStream('deflate-raw'); var w = cs.writable.getWriter(); w.write(bytes); w.close();
  return pump(cs.readable).then(function(out){ return 'SP1.' + b64u(out); });
}
function decodeCode(text){
  var m = /SP([01])\.([A-Za-z0-9_-]+)/.exec(text || '');
  if (!m) return Promise.reject(new Error('badCode'));
  var bytes = unb64u(m[2]);
  var p = m[1] === '0' ? Promise.resolve(bytes) : (function(){ var ds = new DecompressionStream('deflate-raw'); var w = ds.writable.getWriter(); w.write(bytes); w.close(); return pump(ds.readable); })();
  return p.then(function(b){ return JSON.parse(new TextDecoder().decode(b)); }).catch(function(){ throw new Error('badCode'); });
}
function gather(conn){
  return new Promise(function(res){
    if (conn.iceGatheringState === 'complete') return res();
    var to = setTimeout(done, 6000);
    function done(){ clearTimeout(to); conn.removeEventListener('icegatheringstatechange', chk); res(); }
    function chk(){ if (conn.iceGatheringState === 'complete') done(); }
    conn.addEventListener('icegatheringstatechange', chk);
  });
}
function p2pClose(){
  if (dc) { try { dc.onclose = null; dc.close(); } catch(e){} }
  if (pc) { try { pc.close(); } catch(e){} }
  dc = null; pc = null; p2p = { role: null, connected: false, peerName: '', rematch: [] };
}
function newPeer(){
  pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = function(){
    if (!pc) return;
    if (pc.connectionState === 'failed') { if (mode === 'p2p') { p2p.connected = false; render(); } else { $('directStatus').textContent = t('direct.failed'); } }
  };
  return pc;
}
function wireChannel(ch){
  dc = ch;
  ch.onopen = function(){
    p2p.connected = true;
    $('directStatus').textContent = t('direct.connected');
    if (p2p.role === 'host') {
      mode = 'p2p'; seat = 0;
      if (!localState) localState = S.newGame([$('name').value.trim() || t('p1'), p2p.peerName || t('p2')]);
      show('game'); hostBroadcast();
    } else { mode = 'p2p'; seat = 1; }
  };
  ch.onmessage = function(ev){
    var m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (p2p.role === 'host') hostHandle(m); else onMessage(m);
  };
  ch.onclose = function(){ p2p.connected = false; if (mode === 'p2p' && view) render(); };
}
// Host side: the same authority the server has, running on the host's phone.
function hostBroadcast(){
  if (!$('game').classList.contains('on')) show('game');
  applyView(S.viewFor(localState, 0));
  var players = [{ name: localState.players[0].name, connected: true }, { name: localState.players[1].name, connected: p2p.connected }];
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t: 'state', code: null, seat: 1, players: players, state: S.viewFor(localState, 1), rematch: p2p.rematch }));
}
function hostApply(who, action){
  sel = [];
  try { localState = S.apply(localState, who, action); }
  catch (e) { if (who === 0) toast(t('err.' + (e.code || 'invalidAction'))); else if (dc) dc.send(JSON.stringify({ t: 'err', code: e.code || 'invalidAction' })); render(); return; }
  hostBroadcast();
}
function hostRematch(who){
  if (localState.phase !== 'over') return;
  if (p2p.rematch.indexOf(who) < 0) p2p.rematch.push(who);
  if (p2p.rematch.length >= 2) { localState = S.newGame([localState.players[0].name, localState.players[1].name]); p2p.rematch = []; }
  meta.rematch = p2p.rematch; hostBroadcast();
}
function hostHandle(m){
  if (m.t === 'action') hostApply(1, m.action);
  else if (m.t === 'rematch') hostRematch(1);
}
function directUI(role){
  show('direct');
  $('directStatus').textContent = '';
  $('d1Text').value = ''; $('d2Text').value = '';
  if (role === 'host') {
    $('directTitle').textContent = t('direct.hostTitle'); $('directHint').textContent = t('direct.hostHint');
    $('d1Label').textContent = t('direct.hostStep1'); $('d1Share').textContent = t('direct.shareInvite');
    $('d2Label').textContent = t('direct.hostStep2'); $('d2Go').textContent = t('direct.hostGo');
    $('dStep1').hidden = false; $('dStep2').hidden = false; $('d1Text').readOnly = true;
  } else {
    $('directTitle').textContent = t('direct.guestTitle'); $('directHint').textContent = t('direct.guestHint');
    $('d2Label').textContent = t('direct.guestStep2'); $('d2Go').textContent = t('direct.guestGo');
    $('d1Label').textContent = t('direct.guestStep1'); $('d1Share').textContent = t('direct.shareAnswer');
    $('dStep1').hidden = true; $('dStep2').hidden = false; $('d1Text').readOnly = true;
  }
}
function startHost(keepGame){
  if (typeof RTCPeerConnection === 'undefined') { toast(t('direct.unsupported')); return; }
  var n = needName(); if (!n) return;
  if (!keepGame) { p2pClose(); localState = null; }
  else { if (dc) { try { dc.onclose = null; dc.close(); } catch(e){} } if (pc) { try { pc.close(); } catch(e){} } dc = null; pc = null; p2p.connected = false; }
  p2p.role = 'host';
  directUI('host');
  $('directStatus').textContent = t('direct.making');
  var conn = newPeer();
  wireChannel(conn.createDataChannel('splendor', { ordered: true }));
  conn.createOffer().then(function(o){ return conn.setLocalDescription(o); }).then(function(){ return gather(conn); })
    .then(function(){ return encodeCode({ t: 'o', s: conn.localDescription.sdp, n: n }); })
    .then(function(code){ $('d1Text').value = code; $('directStatus').textContent = t('direct.waiting'); })
    .catch(function(){ $('directStatus').textContent = t('direct.failed'); });
}
function hostAccept(text){
  decodeCode(text).then(function(obj){
    if (obj.t !== 'a' || !pc) throw new Error('badCode');
    p2p.peerName = String(obj.n || '').slice(0, 16);
    $('directStatus').textContent = t('direct.connecting');
    return pc.setRemoteDescription({ type: 'answer', sdp: obj.s });
  }).catch(function(e){ $('directStatus').textContent = t(e.message === 'badCode' ? 'direct.badCode' : 'direct.failed'); });
}
function startGuest(){
  if (typeof RTCPeerConnection === 'undefined') { toast(t('direct.unsupported')); return; }
  var n = needName(); if (!n) return;
  p2pClose(); localState = null; p2p.role = 'guest';
  directUI('guest');
}
function guestAnswer(text){
  var n = $('name').value.trim();
  decodeCode(text).then(function(obj){
    if (obj.t !== 'o') throw new Error('badCode');
    p2p.peerName = String(obj.n || '').slice(0, 16);
    $('directStatus').textContent = t('direct.making');
    var conn = newPeer();
    conn.ondatachannel = function(ev){ wireChannel(ev.channel); };
    return conn.setRemoteDescription({ type: 'offer', sdp: obj.s })
      .then(function(){ return conn.createAnswer(); }).then(function(a){ return conn.setLocalDescription(a); })
      .then(function(){ return gather(conn); })
      .then(function(){ return encodeCode({ t: 'a', s: conn.localDescription.sdp, n: n }); })
      .then(function(code){ $('dStep1').hidden = false; $('d1Text').value = code; $('directStatus').textContent = t('direct.connecting'); $('dStep1').scrollIntoView({ block: 'center', behavior: 'smooth' }); });
  }).catch(function(e){ $('directStatus').textContent = t(e.message === 'badCode' ? 'direct.badCode' : 'direct.failed'); });
}
function p2pReconnect(){
  if (p2p.role === 'host') startHost(true);
  else { p2pClose(); p2p.role = 'guest'; directUI('guest'); }
}
function shareCode(){
  var code = $('d1Text').value; if (!code) return;
  var text = t(p2p.role === 'host' ? 'direct.inviteText' : 'direct.answerText') + '\n' + (p2p.role === 'host' ? location.origin + location.pathname + '\n' : '') + code;
  if (navigator.share) navigator.share({ text: text }).catch(function(){});
  else copyText(text);
}
function copyText(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast(t('copied'), true); }, function(){ $('d1Text').select(); });
  else { $('d1Text').select(); }
}
$('hostBtn').onclick = function(){ startHost(false); };
$('guestBtn').onclick = startGuest;
$('d1Share').onclick = shareCode;
$('d1Copy').onclick = function(){ var code = $('d1Text').value; if (code) copyText(t(p2p.role === 'host' ? 'direct.inviteText' : 'direct.answerText') + '\n' + code); };
$('d2Paste').onclick = function(){
  if (!navigator.clipboard || !navigator.clipboard.readText) { toast(t('direct.pasteFail')); $('d2Text').focus(); return; }
  navigator.clipboard.readText().then(function(txt){ $('d2Text').value = txt; $('d2Go').click(); }, function(){ toast(t('direct.pasteFail')); $('d2Text').focus(); });
};
$('d2Go').onclick = function(){
  var text = $('d2Text').value.trim(); if (!text) { $('d2Text').focus(); return; }
  if (p2p.role === 'host') hostAccept(text); else guestAnswer(text);
};

/* ---------------- Misc UI ---------------- */
function paintSound(){
  var on = !(window.FX && FX.isMuted());
  var col = on ? 'var(--gold-2)' : 'var(--ink-3)';
  $('soundBtn').innerHTML = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="' + col +
    '" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h3l4-3v10l-4-3H4z" fill="' + col + '" fill-opacity=".35"/>' +
    (on ? '<path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.8 5.4a6.5 6.5 0 0 1 0 9.2"/>' : '<path d="M13.5 8l4 4M17.5 8l-4 4"/>') +
    '</svg>';
  $('soundBtn').setAttribute('aria-label', t(on ? 'soundOn' : 'soundOff'));
}
$('soundBtn').onclick = function(){
  if (!window.FX) return;
  var nowMuted = FX.setMuted(!FX.isMuted());
  paintSound();
  if (!nowMuted) { FX.arm(); FX.play('gem', { color: 'g' }); }
};
$('rulesBtn').onclick = $('rulesBtn0').onclick = function(){ $('rulesDlg').hidden = false; };
$('rulesClose').onclick = function(){ $('rulesDlg').hidden = true; };
$('langBtn').onclick = function(){ var ks = Object.keys(LANG_NAMES); setLang(ks[(ks.indexOf(lang) + 1) % ks.length]); };
$('code').addEventListener('input', function(){ this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeSheet(); $('rulesDlg').hidden = true; } });

/* ---------------- Boot ---------------- */
if (window.Art) $('emblem').innerHTML = Art.emblem();
setLang(lang);
try { $('name').value = localStorage.getItem('splendor.name') || ''; } catch(e){}
friends = loadJSON('splendor.friends', []);
account = loadJSON('splendor.account', null);
var params = new URLSearchParams(location.search);
refreshResume();
paintHome();
try { history.replaceState({ splendor: 'lobby' }, ''); } catch (e) {}
// A game that was not finished is rejoined without being asked.
(function(){
  var sv = loadLocal();
  if (!sv || !sv.state || sv.state.phase === 'over') return;
  if (sv.at && Date.now() - sv.at > 24 * 60 * 60 * 1000) return;  // yesterday's game stays a choice
  if (sv.tut) return;                                             // a half-finished lesson is not a game
  resumeLocal(sv);
})();

// Accounts, friends and rooms all need the server behind this page. On a static
// host there is none, so ask once and only offer what actually works.
var hasServer = false;
function probeServer(){
  if (isArtifact || location.protocol === 'file:') { offerServerFeatures(false); return; }
  var settled = false;
  var to = setTimeout(function(){ if (!settled) { settled = true; offerServerFeatures(false); } }, 4000);
  try {
    fetch('health', { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(txt){
      if (settled) return;
      settled = true; clearTimeout(to);
      offerServerFeatures(txt.trim() === 'ok');
    }, function(){ if (!settled) { settled = true; clearTimeout(to); offerServerFeatures(false); } });
  } catch (e) { settled = true; clearTimeout(to); offerServerFeatures(false); }
}
function offerServerFeatures(ok){
  hasServer = ok || hasServer || !!account;
  // With no account to take a name from, the offline modes still need somewhere to type one.
  if (!hasServer) {
    $('nameLabel').hidden = false;
    $('name').placeholder = t('yourName');
    $('localPanel').insertBefore($('name'), $('resumeBtn'));
  }
  paintHome();
  ok = hasServer;
  // Swapping connection codes by hand is what you do when there is no server;
  // with one, friends and room codes do the same job without the clutter.
  $('directPanel').hidden = hasServer;
  if (!ok) return;
  if (account) connect();
  if (params.get('room')) {
    $('code').value = params.get('room').toUpperCase().slice(0, 4);
    if (!account) toast(t('err.notLoggedIn'));
  }
}
$('authPanel').hidden = true;
$('homePanel').hidden = true;
probeServer();

// A game left running is not abandoned: coming back here signs straight back into it.
window.addEventListener('pageshow', function(){ if (account && hasServer && (!ws || ws.readyState > 1)) connect(); });
})();
</script>
